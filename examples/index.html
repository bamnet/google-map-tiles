<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🗺️ Google Map Tiles + MapLibre Demo</title>
  </head>
  <body>
    <div id="controls">
      <div class="control-group">
        <label for="apiKey">🔑 API Key:</label>
        <input type="text" id="apiKey" placeholder="Enter Google Maps API Key">
      </div>
      <div class="control-group">
        <label for="mapType">🗺️ Map Type:</label>
        <select id="mapType">
          <option value="roadmap">🛣️ Roadmap</option>
          <option value="satellite">🛰️ Satellite</option>
          <option value="terrain">⛰️ Terrain</option>
        </select>
      </div>
      <div class="control-group">
        <label for="layerType">📍 Layer Type:</label>
        <select id="layerType">
          <option value="">None</option>
          <option value="layerRoadmap">🛣️ Roads</option>
          <option value="layerStreetview">🚶 Street View</option>
          <option value="layerTraffic">🚗 Traffic</option>
        </select>
      </div>
      <div class="control-group">
        <label for="region">🌎 Region:</label>
        <input type="text" id="region" placeholder="e.g., us" value="us">
      </div>
      <div class="control-group">
        <label for="language">🌐 Language:</label>
        <input
          type="text"
          id="language"
          placeholder="e.g., en-US"
          value="en-US"
        >
      </div>
      <div class="control-group">
        <label for="highDpi">🔍 High DPI:</label>
        <input type="checkbox" id="highDpi">
      </div>
    </div>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
