name: Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - "examples/**"
  # Allows publishing manually from the Actions tab, e.g. to retry a failed
  # publish. JSR requires the person running it to be a @bamnet scope member.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Publish package
        run: bunx jsr publish
