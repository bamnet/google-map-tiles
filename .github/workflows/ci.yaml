name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx biome ci .

      - run: bun run check

      - run: bun test

      - run: bun run examples:build

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun run smoke:node
